name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.0). Leave blank when building from a tag.'
        required: false

permissions:
  contents: write
  id-token: write   # Azure sign-in (OpenID Connect) for code signing

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Run tests
        run: dotnet test -warnaserror

  build:
    needs: test
    runs-on: windows-latest
    # Azure trusts sign-ins from this environment only (see docs/SIGNING.md).
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          } elseif ('${{ inputs.version }}') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '0.0.0-ci'
          }
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Building version: $v"

      - name: Publish (x64 and arm64)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          foreach ($arch in 'x64','arm64') {
            dotnet publish src/PatchPal.App -c Release -r "win-$arch" --self-contained `
              -p:PublishSingleFile=true `
              -p:Version=$v -o "dist/publish-$arch"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Verify native DLLs sit beside the exe
        shell: pwsh
        run: |
          # WPF's native DLLs must ship beside PatchPal.exe (not self-extract into %TEMP%).
          # Fail if one is missing or a new one appears that setup.iss and the zip would not carry.
          # The arm64 runtime has no D3DCompiler_47_cor3.dll.
          $common = 'PenImc_cor3.dll','PresentationNative_cor3.dll','vcruntime140_cor3.dll','wpfgfx_cor3.dll'
          $expectedByArch = @{ x64 = $common + 'D3DCompiler_47_cor3.dll'; arm64 = $common }
          foreach ($arch in 'x64','arm64') {
            $expected = $expectedByArch[$arch]
            $actual = @(Get-ChildItem "dist/publish-$arch" -Filter *.dll -File | ForEach-Object Name)
            $diff = Compare-Object ($expected | Sort-Object) ($actual | Sort-Object)
            if ($diff) {
              Write-Host "Unexpected DLL set in dist/publish-${arch}:"
              $diff | Format-Table | Out-String | Write-Host
              exit 1
            }
          }

      # Code signing (docs/SIGNING.md). Skipped while ARTIFACT_SIGNING_ACCOUNT is unset.
      - name: Azure login
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign PatchPal.exe
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\publish-x64\PatchPal.exe
            ${{ github.workspace }}\dist\publish-arm64\PatchPal.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installers
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          foreach ($arch in 'x64','arm64') {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              "/DMyAppVersion=$v" "/DMyAppArch=$arch" "/DMySourceDir=..\dist\publish-$arch" `
              installer\setup.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Sign installers
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: PatchPal-Setup-*.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check signatures
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = @(Get-Item dist/publish-*/PatchPal.exe, dist/PatchPal-Setup-*.exe)
          if ($files.Count -ne 4) { Write-Host "Expected 4 files to check, found $($files.Count)"; exit 1 }
          $bad = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { Write-Host "Not validly signed:"; $bad.FullName | Write-Host; exit 1 }
          $files | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "$($_.Name): $($s.SignerCertificate.Subject)" }

      - name: Build portable zips
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          foreach ($arch in 'x64','arm64') {
            $stage = "dist/portable-$arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "dist/publish-$arch/PatchPal.exe", "dist/publish-$arch/*_cor3.dll", 'README.md', 'LICENSE', 'CHANGELOG.md' $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/PatchPal-portable-$v-$arch.zip" -Force
          }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ASCII
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: PatchPal-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/PatchPal-Setup-${{ steps.ver.outputs.version }}-x64.exe
            dist/PatchPal-Setup-${{ steps.ver.outputs.version }}-arm64.exe
            dist/PatchPal-portable-${{ steps.ver.outputs.version }}-x64.zip
            dist/PatchPal-portable-${{ steps.ver.outputs.version }}-arm64.zip
            dist/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
